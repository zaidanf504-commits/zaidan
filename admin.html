<!DOCTYPE html>
<html lang="id" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin — Live Chat | Zaidan</title>
    <meta name="description" content="Panel admin untuk live chat portofolio Zaidan.">
    <meta name="robots" content="noindex, nofollow">

    <script>
        (function () {
            var root = document.documentElement;
            root.classList.remove('no-js');
            root.classList.add('js-enabled');
            var stored = null;
            try { stored = localStorage.getItem('theme'); } catch (e) {}
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (stored === 'dark' || (!stored && prefersDark)) root.classList.add('dark');
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/animations.css">

    <style>
        /* ==================================================================
           ADMIN PANEL v2 — UI UPGRADE
           ================================================================== */

        :root {
            --admin-accent: #8B5CF6;
            --admin-accent-soft: rgba(139, 92, 246, 0.08);
            --admin-bg: #ffffff;
            --admin-bg-alt: #f7f7f8;
            --admin-sidebar: #fafafa;
            --admin-border: #e5e7eb;
            --admin-text: #0e0e0e;
            --admin-text-muted: #6b7280;
            --admin-bubble-visitor: #ffffff;
            --admin-bubble-admin: #0e0e0e;
            --admin-bubble-admin-text: #ffffff;
        }

        .dark {
            --admin-accent: #A78BFA;
            --admin-accent-soft: rgba(167, 139, 250, 0.12);
            --admin-bg: #0e0e0e;
            --admin-bg-alt: #161616;
            --admin-sidebar: #131313;
            --admin-border: #262626;
            --admin-text: #ffffff;
            --admin-text-muted: #a3a3a3;
            --admin-bubble-visitor: #1c1c1c;
            --admin-bubble-admin: #ffffff;
            --admin-bubble-admin-text: #0e0e0e;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--admin-bg);
            color: var(--admin-text);
            overflow: hidden;
        }

        /* ==================================================================
           LAYOUT
           ================================================================== */
        .admin-layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        @media (max-width: 900px) {
            .admin-layout { grid-template-columns: 1fr; }
            .admin-sidebar { display: none !important; }
            .admin-sidebar.is-visible { display: flex !important; }
            .admin-main { display: none !important; }
            .admin-main.is-visible { display: flex !important; }
        }

        /* Scrollbar halus */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.12);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.25); }
        .dark ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); }
        .dark ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }

        /* ==================================================================
           SIDEBAR
           ================================================================== */
        .admin-sidebar {
            background: var(--admin-sidebar);
            border-right: 1px solid var(--admin-border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--admin-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-logo-mark {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--admin-text);
            color: var(--admin-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 15px;
            position: relative;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sidebar-logo-mark:hover {
            transform: scale(1.08) rotate(-4deg);
        }

        /* Dot merah online indicator */
        .sidebar-logo-mark::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #10b981;
            border: 2px solid var(--admin-sidebar);
            animation: pulse-online 2s infinite;
        }

        @keyframes pulse-online {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
            50% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
        }

        .sidebar-logo-text h1 {
            font-size: 14px;
            font-weight: 800;
            margin: 0;
            line-height: 1.2;
            letter-spacing: -0.01em;
        }

        .sidebar-logo-text span {
            font-size: 11px;
            color: var(--admin-text-muted);
            font-weight: 600;
        }

        .sidebar-actions {
            display: flex;
            gap: 4px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: transparent;
            border: none;
            color: var(--admin-text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 18px;
            font-family: inherit;
        }

        .icon-btn:hover {
            background: var(--admin-accent-soft);
            color: var(--admin-accent);
        }

        .icon-btn.danger:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        /* Search */
        .sidebar-search {
            padding: 12px 16px;
            border-bottom: 1px solid var(--admin-border);
            flex-shrink: 0;
        }

        .search-wrapper {
            position: relative;
        }

        .search-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--admin-text-muted);
            font-size: 16px;
            pointer-events: none;
        }

        .search-wrapper input {
            width: 100%;
            padding: 10px 12px 10px 38px;
            background: var(--admin-bg);
            border: 1px solid var(--admin-border);
            border-radius: 10px;
            font-size: 13px;
            font-family: inherit;
            color: var(--admin-text);
            outline: none;
            transition: border-color 0.2s;
        }

        .search-wrapper input:focus {
            border-color: var(--admin-accent);
        }

        .search-wrapper input::placeholder {
            color: var(--admin-text-muted);
        }

        /* Filter tabs */
        .filter-tabs {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--admin-border);
            flex-shrink: 0;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .filter-tabs::-webkit-scrollbar { display: none; }

        .filter-tab {
            padding: 6px 12px;
            border-radius: 8px;
            background: transparent;
            border: 1px solid transparent;
            color: var(--admin-text-muted);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .filter-tab:hover {
            background: var(--admin-accent-soft);
            color: var(--admin-accent);
        }

        .filter-tab.is-active {
            background: var(--admin-text);
            color: var(--admin-bg);
        }

        .filter-tab.is-active .badge-count {
            background: var(--admin-bg);
            color: var(--admin-text);
        }

        .badge-count {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            font-size: 10px;
            font-weight: 800;
            padding: 1px 6px;
            border-radius: 8px;
            min-width: 16px;
            text-align: center;
        }

        /* Conversation list */
        .conv-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .conv-item {
            padding: 14px 16px;
            border-bottom: 1px solid var(--admin-border);
            cursor: pointer;
            transition: background 0.15s;
            position: relative;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .conv-item:hover {
            background: var(--admin-accent-soft);
        }

        .conv-item.is-active {
            background: var(--admin-accent-soft);
        }

        .conv-item.is-active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--admin-accent);
        }

        .conv-item.is-unread {
            background: rgba(139, 92, 246, 0.04);
        }

        .dark .conv-item.is-unread {
            background: rgba(139, 92, 246, 0.06);
        }

        .conv-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 15px;
            color: #fff;
            flex-shrink: 0;
            background: linear-gradient(135deg, #8B5CF6, #EC4899);
            position: relative;
        }

        .conv-avatar::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #10b981;
            border: 2px solid var(--admin-sidebar);
        }

        .conv-body {
            flex: 1;
            min-width: 0;
        }

        .conv-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 4px;
        }

        .conv-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--admin-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conv-time {
            font-size: 11px;
            color: var(--admin-text-muted);
            font-weight: 600;
            flex-shrink: 0;
        }

        .conv-preview {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .conv-preview-text {
            font-size: 12.5px;
            color: var(--admin-text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            line-height: 1.4;
        }

        .conv-preview-text.is-unread-text {
            color: var(--admin-text);
            font-weight: 600;
        }

        .unread-pill {
            background: #ef4444;
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 10px;
            min-width: 20px;
            text-align: center;
            flex-shrink: 0;
            animation: unread-bounce 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes unread-bounce {
            0% { transform: scale(0); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .conv-empty {
            padding: 40px 20px;
            text-align: center;
            color: var(--admin-text-muted);
            font-size: 13px;
            line-height: 1.6;
        }

        .conv-empty i {
            font-size: 48px;
            opacity: 0.3;
            display: block;
            margin-bottom: 12px;
        }

        /* ==================================================================
           MAIN AREA
           ================================================================== */
        .admin-main {
            background: var(--admin-bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Empty state */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
            position: relative;
        }

        .empty-state::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(to right, rgba(0, 0, 0, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .dark .empty-state::before {
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }

        .empty-state-icon {
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background: var(--admin-accent-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: var(--admin-accent);
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .empty-state h2 {
            font-size: 20px;
            font-weight: 800;
            margin: 0 0 8px;
            position: relative;
            z-index: 1;
        }

        .empty-state p {
            color: var(--admin-text-muted);
            font-size: 14px;
            max-width: 320px;
            margin: 0;
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }

        /* Chat header */
        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--admin-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            background: var(--admin-bg);
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }

        .chat-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8B5CF6, #EC4899);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 15px;
            flex-shrink: 0;
            position: relative;
        }

        .chat-avatar::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #10b981;
            border: 2px solid var(--admin-bg);
        }

        .chat-info {
            min-width: 0;
            flex: 1;
        }

        .chat-name {
            font-size: 15px;
            font-weight: 800;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--admin-text);
        }

        .chat-meta {
            font-size: 11.5px;
            color: var(--admin-text-muted);
            margin: 2px 0 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        /* Messages area */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--admin-bg-alt);
        }

        /* Date divider */
        .date-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0 12px;
            font-size: 11px;
            font-weight: 700;
            color: var(--admin-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .date-divider::before,
        .date-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--admin-border);
        }

        /* Message row */
        .msg-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            max-width: 78%;
            animation: msg-pop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes msg-pop {
            from { opacity: 0; transform: translateY(6px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .msg-row.is-visitor { align-self: flex-start; }
        .msg-row.is-admin { align-self: flex-end; flex-direction: row-reverse; }

        .msg-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            color: #fff;
            flex-shrink: 0;
            background: linear-gradient(135deg, #8B5CF6, #EC4899);
            margin-bottom: 4px;
        }

        .msg-row.is-admin .msg-avatar {
            background: linear-gradient(135deg, #0e0e0e, #333);
        }

        .dark .msg-row.is-admin .msg-avatar {
            background: linear-gradient(135deg, #fff, #ccc);
            color: #0e0e0e;
        }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
            position: relative;
            max-width: 100%;
        }

        .msg-row.is-visitor .msg-bubble {
            background: var(--admin-bubble-visitor);
            color: var(--admin-text);
            border: 1px solid var(--admin-border);
            border-bottom-left-radius: 4px;
        }

        .msg-row.is-admin .msg-bubble {
            background: var(--admin-bubble-admin);
            color: var(--admin-bubble-admin-text);
            border-bottom-right-radius: 4px;
        }

        .msg-time {
            font-size: 10px;
            opacity: 0.55;
            margin-top: 4px;
            display: block;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .msg-copy-btn {
            position: absolute;
            top: -10px;
            background: var(--admin-bg);
            border: 1px solid var(--admin-border);
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 700;
            color: var(--admin-text-muted);
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: inherit;
            z-index: 10;
        }

        .msg-row.is-visitor .msg-copy-btn { right: 4px; }
        .msg-row.is-admin .msg-copy-btn { left: 4px; }

        .msg-row:hover .msg-copy-btn { opacity: 1; }

        .msg-copy-btn:hover {
            color: var(--admin-accent);
            border-color: var(--admin-accent);
        }

        /* ==================================================================
           INPUT AREA
           ================================================================== */
        .input-area {
            padding: 14px 20px 18px;
            border-top: 1px solid var(--admin-border);
            background: var(--admin-bg);
            flex-shrink: 0;
        }

        /* Quick replies */
        .quick-replies {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 2px;
        }

        .quick-replies::-webkit-scrollbar { display: none; }

        .quick-reply {
            padding: 6px 12px;
            background: var(--admin-accent-soft);
            color: var(--admin-accent);
            border: 1px solid transparent;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
        }

        .quick-reply:hover {
            background: var(--admin-accent);
            color: #fff;
            transform: translateY(-1px);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-field-wrapper {
            flex: 1;
            position: relative;
            background: var(--admin-bg-alt);
            border: 1px solid var(--admin-border);
            border-radius: 22px;
            transition: border-color 0.2s;
        }

        .input-field-wrapper:focus-within {
            border-color: var(--admin-accent);
            box-shadow: 0 0 0 3px var(--admin-accent-soft);
        }

        .input-field-wrapper textarea {
            width: 100%;
            padding: 12px 44px 12px 16px;
            background: transparent;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            color: var(--admin-text);
            resize: none;
            max-height: 140px;
            min-height: 24px;
            line-height: 1.5;
            display: block;
        }

        .input-field-wrapper textarea::placeholder {
            color: var(--admin-text-muted);
        }

        .emoji-btn {
            position: absolute;
            right: 8px;
            bottom: 8px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: transparent;
            border: none;
            color: var(--admin-text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
        }

        .emoji-btn:hover {
            background: var(--admin-accent-soft);
            color: var(--admin-accent);
        }

        .send-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--admin-text);
            color: var(--admin-bg);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            background: var(--admin-accent);
            color: #fff;
            transform: scale(1.05);
        }

        .send-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* Emoji picker */
        .emoji-picker {
            position: absolute;
            bottom: 100%;
            right: 0;
            margin-bottom: 10px;
            background: var(--admin-bg);
            border: 1px solid var(--admin-border);
            border-radius: 14px;
            padding: 10px;
            display: none;
            grid-template-columns: repeat(8, 1fr);
            gap: 2px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
            z-index: 50;
            max-width: 280px;
        }

        .emoji-picker.is-open {
            display: grid;
        }

        .emoji-option {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            background: transparent;
            border: none;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
            padding: 0;
        }

        .emoji-option:hover {
            background: var(--admin-accent-soft);
        }

        /* Mobile back button */
        .mobile-back {
            display: none;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: transparent;
            border: none;
            color: var(--admin-text);
            font-size: 22px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .mobile-back:hover {
            background: var(--admin-accent-soft);
        }

        @media (max-width: 900px) {
            .mobile-back { display: flex; }
        }

        /* ==================================================================
           TOAST NOTIFICATION
           ================================================================== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--admin-text);
            color: var(--admin-bg);
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .toast.is-visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ==================================================================
           LOGIN SCREEN
           ================================================================== */
        .login-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--admin-bg);
            padding: 24px;
        }

        .login-screen::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        .dark .login-screen::before {
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--admin-bg-alt);
            border: 1px solid var(--admin-border);
            border-radius: 24px;
            padding: 36px 32px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.12);
            position: relative;
            z-index: 1;
        }

        .login-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
        }

        .login-mark {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: var(--admin-text);
            color: var(--admin-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 22px;
            letter-spacing: -0.02em;
        }

        .login-title h1 {
            font-size: 20px;
            font-weight: 900;
            margin: 0 0 2px;
            letter-spacing: -0.02em;
        }

        .login-title p {
            font-size: 12.5px;
            color: var(--admin-text-muted);
            margin: 0;
            font-weight: 600;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-field label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--admin-text-muted);
            margin-bottom: 8px;
        }

        .form-field input {
            width: 100%;
            padding: 14px 16px;
            background: var(--admin-bg);
            border: 1px solid var(--admin-border);
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            color: var(--admin-text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-field input:focus {
            border-color: var(--admin-accent);
            box-shadow: 0 0 0 3px var(--admin-accent-soft);
        }

        .form-field input::placeholder {
            color: var(--admin-text-muted);
            opacity: 0.7;
        }

        .login-submit {
            width: 100%;
            padding: 14px;
            background: var(--admin-text);
            color: var(--admin-bg);
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
        }

        .login-submit:hover:not(:disabled) {
            background: var(--admin-accent);
            color: #fff;
        }

        .login-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-error {
            padding: 10px 14px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            color: #ef4444;
            font-size: 13px;
            font-weight: 600;
            display: none;
        }

        .login-error.is-visible {
            display: block;
            animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .login-footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--admin-border);
            text-align: center;
        }

        .login-footer a {
            font-size: 12px;
            color: var(--admin-text-muted);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s;
        }

        .login-footer a:hover {
            color: var(--admin-accent);
        }
    </style>
</head>
<body>

    <!-- ==================================================================
         LOGIN SCREEN
         ================================================================== -->
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <div class="login-header">
                <div class="login-mark">Z</div>
                <div class="login-title">
                    <h1>Admin Panel</h1>
                    <p>Live Chat — Zaidan Faiz</p>
                </div>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-field">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required
                        placeholder="email@kamu.com" autocomplete="email">
                </div>
                <div class="form-field">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required
                        placeholder="••••••••" autocomplete="current-password">
                </div>
                <div id="loginError" class="login-error"></div>
                <button type="submit" id="loginBtn" class="login-submit">
                    <i class='bx bx-log-in'></i> Masuk
                </button>
            </form>

            <div class="login-footer">
                <a href="index.html">← Kembali ke situs</a>
            </div>
        </div>
    </div>

    <!-- ==================================================================
         ADMIN APP
         ================================================================== -->
    <div id="adminApp" class="admin-layout" style="display: none;">

        <!-- ============ SIDEBAR ============ -->
        <aside class="admin-sidebar is-visible">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="sidebar-logo-mark">Z</div>
                    <div class="sidebar-logo-text">
                        <h1>Live Chat</h1>
                        <span id="onlineStatus">Menghubungkan...</span>
                    </div>
                </div>
                <div class="sidebar-actions">
                    <button id="soundToggle" class="icon-btn" title="Suara notifikasi" aria-label="Toggle suara">
                        <i class='bx bx-volume-full'></i>
                    </button>
                    <button id="logoutBtn" class="icon-btn danger" title="Logout" aria-label="Logout">
                        <i class='bx bx-log-out'></i>
                    </button>
                </div>
            </div>

            <div class="sidebar-search">
                <div class="search-wrapper">
                    <i class='bx bx-search'></i>
                    <input type="text" id="searchConv" placeholder="Cari nama visitor...">
                </div>
            </div>

            <div class="filter-tabs">
                <button class="filter-tab is-active" data-filter="all">
                    Semua
                    <span class="badge-count" id="countAll">0</span>
                </button>
                <button class="filter-tab" data-filter="unread">
                    Belum dibaca
                    <span class="badge-count" id="countUnread">0</span>
                </button>
                <button class="filter-tab" data-filter="today">
                    Hari ini
                </button>
            </div>

            <div id="convList" class="conv-list">
                <div class="conv-empty">
                    <i class='bx bx-loader-circle bx-spin'></i>
                    Memuat percakapan...
                </div>
            </div>
        </aside>

        <!-- ============ MAIN ============ -->
        <main class="admin-main is-visible">

            <div id="emptyState" class="empty-state">
                <div class="empty-state-icon">
                    <i class='bx bx-message-rounded-dots'></i>
                </div>
                <h2>Pilih percakapan</h2>
                <p>Klik salah satu percakapan di sidebar untuk mulai membalas pesan dari visitor.</p>
            </div>

            <div id="chatView" style="display: none; flex-direction: column; flex: 1; overflow: hidden;">
                <!-- Chat header -->
                <header class="chat-header">
                    <button id="backBtn" class="mobile-back" aria-label="Kembali">
                        <i class='bx bx-left-arrow-alt'></i>
                    </button>
                    <div class="chat-header-left">
                        <div class="chat-avatar" id="chatAvatar">?</div>
                        <div class="chat-info">
                            <h2 class="chat-name" id="chatName">—</h2>
                            <p class="chat-meta" id="chatMeta">—</p>
                        </div>
                    </div>
                    <button id="deleteConvBtn" class="icon-btn danger" title="Hapus percakapan" aria-label="Hapus">
                        <i class='bx bx-trash'></i>
                    </button>
                </header>

                <!-- Messages -->
                <div id="adminMessages" class="messages-area"></div>

                <!-- Input -->
                <div class="input-area">
                    <div class="quick-replies" id="quickReplies">
                        <button class="quick-reply" data-text="Halo! Terima kasih sudah menghubungi. Ada yang bisa saya bantu?">👋 Salam</button>
                        <button class="quick-reply" data-text="Baik, saya akan jelaskan ya. Mohon tunggu sebentar.">⏳ Tunggu</button>
                        <button class="quick-reply" data-text="Terima kasih atas pertanyaannya! Untuk info lebih detail, boleh hubungi saya via email ya.">📧 Email</button>
                        <button class="quick-reply" data-text="Untuk estimasi biaya, tergantung kompleksitas proyek. Boleh ceritakan lebih detail?">💰 Harga</button>
                        <button class="quick-reply" data-text="Siap! Saya kerjakan ya. Nanti saya kabari kalau sudah selesai.">✅ Siap</button>
                        <button class="quick-reply" data-text="Baik, terima kasih banyak! Semoga harimu menyenangkan 😊">🙏 Penutup</button>
                    </div>

                    <form id="adminForm" class="input-wrapper">
                        <div class="input-field-wrapper">
                            <textarea id="adminInput" rows="1" placeholder="Ketik balasan..." maxlength="2000"></textarea>
                            <button type="button" class="emoji-btn" id="emojiBtn" aria-label="Emoji">
                                <i class='bx bx-smile'></i>
                            </button>
                            <div class="emoji-picker" id="emojiPicker">
                                <button type="button" class="emoji-option">😊</button>
                                <button type="button" class="emoji-option">😂</button>
                                <button type="button" class="emoji-option">🙏</button>
                                <button type="button" class="emoji-option">👍</button>
                                <button type="button" class="emoji-option">❤️</button>
                                <button type="button" class="emoji-option">🔥</button>
                                <button type="button" class="emoji-option">✨</button>
                                <button type="button" class="emoji-option">🎉</button>
                                <button type="button" class="emoji-option">👋</button>
                                <button type="button" class="emoji-option">💬</button>
                                <button type="button" class="emoji-option">📧</button>
                                <button type="button" class="emoji-option">✅</button>
                                <button type="button" class="emoji-option">⏳</button>
                                <button type="button" class="emoji-option">💰</button>
                                <button type="button" class="emoji-option">💡</button>
                                <button type="button" class="emoji-option">🚀</button>
                            </div>
                        </div>
                        <button type="submit" id="adminSend" class="send-btn" disabled aria-label="Kirim">
                            <i class='bx bx-send'></i>
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">
        <i class='bx bx-check-circle'></i>
        <span id="toastText"></span>
    </div>

    <!-- ============ SCRIPTS ============ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
